plugins {
    id 'application'
}

group = 'ru.study'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ru.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy 'testRunFinished'

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

test {
    useJUnitPlatform {
        excludeTags 'intentional-failure'
    }
}

tasks.register('topic3Task1', Test) {
    group = 'verification'
    description = 'Runs four assertion examples, including one intentional failure'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'topic3-task1'
    }
}

tasks.register('topic3Task2', Test) {
    group = 'verification'
    description = 'Runs assertion checks for all twelve methods'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'topic3-task2'
    }
}

tasks.register('testRunFinished') {
    group = 'verification'
    description = 'Prints a message after the tests finish'

    doLast {
        println 'Test run is over'
    }
}
